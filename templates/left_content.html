{# left_content.html - 图谱查询与可视化区域 #}
<main class="lyear-layout-content">
    <div class="container-fluid p-0 h-100">
        <div class="row g-0 m-0 flex-column h-100 w-100">
            <div class="query-section">
                <div class="card flex-grow-1 w-100">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-search me-1"></i> 图谱查询
                        </h6>
                    </div>
                    <div class="card-body">
                        <form id="graphQueryForm" class="graph-query-form flex-grow-1">
                            {% csrf_token %}
                            <div class="graph-query-grid">
                                <div class="graph-query-col">
                                    <div class="graph-query-field">
                                        <label for="startNode" class="graph-query-label">起始节点</label>
                                        <input type="text" class="form-control input-sm" id="startNode" name="start"
                                            placeholder="示例：东经路">
                                    </div>
                                </div>

                                <div class="graph-query-col">
                                    <div class="graph-query-field">
                                        <label for="relation" class="graph-query-label">关系类型</label>
                                        <input type="text" class="form-control input-sm" id="relation" name="relation"
                                            placeholder="示例：Belong_to">
                                    </div>
                                </div>

                                <div class="graph-query-col">
                                    <div class="graph-query-field">
                                        <label for="endNode" class="graph-query-label">目标节点</label>
                                        <input type="text" class="form-control input-sm" id="endNode" name="end"
                                            placeholder="示例：NE104K02023XXXXXX">
                                    </div>
                                </div>

                                <div class="graph-query-action">
                                    <button type="submit" class="btn" id="queryButton">
                                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                                        <span class="btn-text">查询</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="graph-section">
                <div class="card shadow-sm flex-grow-1 w-100">
                    <div class="card-header">
                        <h6 class="mb-0"><i class="fas fa-chart-network me-2"></i> 可视化图谱</h6>
                    </div>
                    <div class="card-body position-relative p-0">
                        <div id="graphLoader" class="loader-overlay d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div class="graph-actions">
                            <button type="button" class="btn btn-sm" id="resetZoom">
                                <i class="fas fa-redo-alt me-1"></i> 图谱重置
                            </button>
                            <button type="button" class="btn btn-sm" id="relationReasoning">
                                <i class="fas fa-project-diagram me-1"></i> 关系推理
                            </button>
                            <button type="button" class="btn btn-sm" id="pathAnalysis">
                                <i class="fas fa-route me-1"></i> 路径分析
                            </button>
                        </div>
                        <div id="main" class="echart-container"></div>
                        <div id="graphLabelLayer" class="graph-label-layer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
