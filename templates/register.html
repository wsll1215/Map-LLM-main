<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <title>注册</title>
    <link rel="icon" href="data:," type="image/x-icon">
    <meta name="keywords" content="注册">
    <meta name="description" content="注册">
    <meta name="author" content="yinqi">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="/static/css/style.min.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
</head>

<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-visual">
            <div class="auth-brand">
                <div class="auth-brand-mark">路</div>
                <div class="auth-brand-text">
                    <strong>路网知识图谱系统</strong>
                    <span>创建账号后即可进入制图工作台</span>
                </div>
            </div>

            <div class="auth-visual-copy">
                <div class="auth-kicker">
                    <i class="mdi mdi-account-plus"></i>
                    创建你的系统账号
                </div>
                <h1>注册一个账号，把地图制作流程接上去。</h1>
                <p>
                    注册后，你可以继续使用图谱查询、地图制作和历史会话，整个流程保持在同一个空间里。
                </p>

                <div class="auth-points">
                    <div class="auth-point">
                        <i class="mdi mdi-account-check"></i>
                        <div>
                            <strong>账号独立</strong>
                            <span>每个用户都有自己的会话与结果</span>
                        </div>
                    </div>
                    <div class="auth-point">
                        <i class="mdi mdi-history"></i>
                        <div>
                            <strong>继续上次工作</strong>
                            <span>登录后可以直接回到历史地图与图谱</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="auth-footnote">密码建议不少于 6 位，并尽量使用易记但不常见的组合。</div>
        </div>

        <div class="auth-form-panel">
            <div class="auth-form-head">
                <h2>创建账号</h2>
                <p>填写用户名和密码即可完成注册。</p>
            </div>

            {% if msg %}
                <div class="auth-alert auth-alert-error" role="alert">{{ msg }}</div>
            {% endif %}

            <form class="auth-form" action="{% url 'accounts:register' %}" method="post">
                {% csrf_token %}
                <div class="auth-field">
                    <label for="username">用户名</label>
                    <div class="auth-input-wrap">
                        <i class="mdi mdi-account-outline"></i>
                        <input
                            name="username"
                            type="text"
                            class="auth-input"
                            id="username"
                            placeholder="请输入用户名"
                            autocomplete="username"
                            autofocus
                        >
                    </div>
                </div>

                <div class="auth-field">
                    <label for="password">密码</label>
                    <div class="auth-input-wrap">
                        <i class="mdi mdi-lock"></i>
                        <input
                            name="password"
                            type="password"
                            class="auth-input"
                            id="password"
                            placeholder="请输入密码"
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <div class="auth-field">
                    <label for="password2">确认密码</label>
                    <div class="auth-input-wrap">
                        <i class="mdi mdi-lock-open"></i>
                        <input
                            name="password2"
                            type="password"
                            class="auth-input"
                            id="password2"
                            placeholder="请再次输入密码"
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <button class="auth-submit" type="submit">注册</button>
            </form>

            <div class="auth-links">
                <a href="{% url 'accounts:login' %}">
                    <i class="mdi mdi-login-variant"></i>
                    已有账号，去登录
                </a>
            </div>
        </div>
    </section>
</main>

<script type="text/javascript" src="/static/js/jquery.min.js"></script>
<script type="text/javascript" src="/static/js/bootstrap.min.js"></script>
</body>
</html>
