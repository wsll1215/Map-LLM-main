{# right_content.html - 问答助手区域 #}
<main class="lyear-layout-content">
    <div class="container-fluid h-100 p-0">
        <div class="card shadow-sm h-100 d-flex flex-column">
            <div class="card-header qa-header">
                <h6 class="mb-0"><i class="fas fa-robot me-2"></i>问答助手</h6>
            </div>
            <div class="card-body qa-card-body flex-grow-1 d-flex flex-column">
                <div class="chat-container flex-grow-1 overflow-auto d-flex flex-column-reverse">
                    {% for wen in all_wendas %}
                    <div class="chat-message">
                        <div class="question-bubble">
                            <div class="message-mark">
                                <img src="/static/images/Q.png" alt="Question">
                                <span>提问</span>
                            </div>
                            <div class="message-body">
                                {{ wen.question }}
                            </div>
                        </div>

                        <div class="answer-bubble">
                            <div class="message-mark">
                                <img src="/static/images/A.png" alt="Answer">
                                <span>回答</span>
                            </div>
                            <div class="message-body qa-history-answer">{{ wen.anster|safe }}</div>
                        </div>
                    </div>
                    {% empty %}
                    <div class="chat-empty-state">
                        <i class="fas fa-comments"></i>
                        <strong>暂无对话记录</strong>
                        <p>先在下面输入一个问题，我们来帮你定位图谱信息。</p>
                    </div>
                    {% endfor %}
                </div>

                <form id="qa-form" class="qa-composer">
                    {% csrf_token %}
                    <label class="qa-composer-label" for="questionInput">输入问题</label>
                    <textarea class="form-control qa-input" name="key" id="questionInput" placeholder="请输入相关问题"
                        onkeydown="if(event.keyCode === 13 && !event.shiftKey) { $('#qa-form').submit(); return false; }"></textarea>
                    <div class="qa-action-row button-group">
                        <button class="btn qa-action-btn qa-primary-btn" type="submit">
                            <i class="fas fa-search me-1"></i> 获取解答
                        </button>
                        <button id="satisfaction-btn" class="btn qa-action-btn" type="button">
                            <i class="fas fa-star me-1"></i> 满意度
                        </button>
                        <button id="clean-history-btn" class="btn qa-action-btn" type="button">
                            <i class="fas fa-trash-alt me-1"></i> 清除
                        </button>
                    </div>
                </form>

                {% if daan %}
                <div class="result-card mt-3 p-4 bg-light rounded">
                    <h5 class="mb-3">
                        <i class="fas fa-lightbulb me-2"></i> 解答结果
                    </h5>
                    <div class="answer-content ps-3 border-start border-3 border-success">
                        {{ daan|safe }}
                    </div>
                    {% if sql %}
                    <div class="mt-3 text-muted small">
                        <i class="fas fa-code me-2"></i> 查询语句：<code>{{ sql }}</code>
                    </div>
                    {% endif %}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</main>
